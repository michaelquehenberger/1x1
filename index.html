<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1x1 Fußball-Arena</title>
    <style>
        :root {
            --grass-dark: #1b5e20;
            --grass-light: #2e7d32;
            --gold: #ffd700;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 20px 0 90px 0;
            background: repeating-linear-gradient(
                90deg,
                var(--grass-dark),
                var(--grass-dark) 40px,
                var(--grass-light) 40px,
                var(--grass-light) 80px
            );
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* ---------- Hintergrund-Animation ---------- */
        #bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .light {
            position: absolute;
            top: -120px;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 220, 0.45), rgba(255, 255, 220, 0) 65%);
            animation: flood 4s ease-in-out infinite;
        }
        .light.l1 { left: -100px; }
        .light.l2 { right: -100px; animation-delay: 2s; }

        @keyframes flood {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .roll {
            position: absolute;
            left: -60px;
            font-size: 2.2rem;
            opacity: 0.45;
            animation: roll 14s linear infinite;
        }
        .roll.r1 { top: 18%; }
        .roll.r2 { top: 52%; animation-duration: 19s; animation-delay: -6s; }
        .roll.r3 { top: 78%; animation-duration: 11s; animation-delay: -3s; }

        @keyframes roll {
            from { transform: translateX(0) rotate(0deg); }
            to { transform: translateX(calc(100vw + 120px)) rotate(1080deg); }
        }

        .crowd {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 70px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding-bottom: 6px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0));
            font-size: 1.8rem;
        }

        .fan {
            display: inline-block;
            animation: wave 3s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 70%, 100% { transform: translateY(0); }
            80% { transform: translateY(-18px); }
        }

        body.cheer .fan { animation: jump 0.4s ease-in-out infinite; }

        @keyframes jump {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-22px) scale(1.15); }
        }

        #confetti {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            overflow: hidden;
        }

        .conf {
            position: absolute;
            top: -40px;
            font-size: 1.6rem;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(540deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .light, .roll, .fan, body.cheer .fan, .conf, #keeper { animation: none !important; }
        }

        /* ---------- Karte ---------- */
        .stadium-card {
            background: rgba(18, 25, 35, 0.95);
            border: 4px solid var(--gold);
            border-radius: 24px;
            padding: 25px;
            width: 95%;
            max-width: 800px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px #000;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #cfd8dc;
            margin-bottom: 20px;
        }

        .setup-section { margin-bottom: 18px; }

        .rule-hint {
            font-size: 0.95rem;
            color: #b0bec5;
            margin-top: -8px;
        }

        /* ---------- Spieler-Karten ---------- */
        .player-setup {
            display: flex;
            gap: 12px;
            margin: 10px 0 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .player-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 12px;
            flex: 1;
            min-width: 200px;
            max-width: 250px;
            border: 3px solid rgba(255,255,255,0.15);
            opacity: 0.55;
            transition: opacity 0.2s, border-color 0.2s, transform 0.2s;
        }

        .player-card.selected {
            border-color: var(--pc);
            background: rgba(255,255,255,0.1);
            opacity: 1;
            transform: scale(1.02);
        }

        .player-card h3 {
            margin: 6px 0 8px 0;
            font-size: 1.4rem;
        }

        .join-btn {
            width: 100%;
            background: #37474f;
            color: #fff;
            font-size: 1rem;
            padding: 8px;
        }

        .player-card.selected .join-btn { background: var(--pc); }

        .avatar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            object-fit: cover;
            background: var(--pc, #546e7a);
            color: #fff;
            font-weight: 900;
            border: 3px solid var(--pc, #fff);
            flex-shrink: 0;
            vertical-align: middle;
        }

        .avatar-lg { width: 92px; height: 92px; font-size: 2.6rem; margin-top: 10px; }
        .avatar-md { width: 52px; height: 52px; font-size: 1.5rem; }
        .avatar-sm { width: 34px; height: 34px; font-size: 1rem; border-width: 2px; }

        .photo-actions {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 6px;
        }

        .photo-btn, .photo-del {
            background: #263238;
            color: #fff;
            font-size: 0.9rem;
            padding: 5px 10px;
            border-radius: 10px;
            border: 1px solid #546e7a;
            cursor: pointer;
            font-weight: bold;
        }

        .progress-line {
            margin-top: 8px;
            font-size: 0.95rem;
            color: #eceff1;
            line-height: 1.6;
        }

        .progress-line span { white-space: nowrap; display: inline-block; margin: 0 4px; }

        select, button {
            font-size: 1.1rem;
            padding: 10px 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.15s, background 0.2s;
        }

        select {
            width: 100%;
            background: #263238;
            color: white;
            border: 2px solid #546e7a;
            margin-top: 4px;
            font-size: 1rem;
        }

        .cap-label { font-size: 0.9rem; color: #b0bec5; }

        .choice-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 10px 0 10px 0;
        }

        .choice-btn {
            background: #37474f;
            color: #eceff1;
            border: 2px solid #546e7a;
            flex: 1;
            min-width: 160px;
        }

        .choice-btn.active {
            background: var(--gold);
            color: #000;
            border-color: #fff;
            transform: scale(1.03);
        }

        .choice-btn.locked {
            background: #263238;
            color: #78909c;
            border-style: dashed;
            cursor: not-allowed;
        }

        .choice-btn.shake { animation: shake 0.4s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .start-btn {
            background: linear-gradient(45deg, #00c853, #64dd17);
            color: #000;
            font-size: 1.5rem;
            padding: 15px 40px;
            border-radius: 50px;
            box-shadow: 0 6px 0 #1b5e20;
            margin-top: 10px;
        }

        .start-btn:hover { transform: translateY(-2px); }
        .start-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #1b5e20; }

        .secondary-btn {
            background: #455a64;
            color: #fff;
            margin-top: 10px;
        }

        .setup-error {
            color: #ff8a80;
            font-weight: bold;
            min-height: 1.4rem;
            margin-top: 8px;
        }

        .parents {
            margin-top: 18px;
            font-size: 0.9rem;
            color: #90a4ae;
        }

        .parents summary { cursor: pointer; }

        .parents button {
            font-size: 0.9rem;
            padding: 6px 12px;
            margin: 8px 4px 0 4px;
            background: #37474f;
            color: #fff;
        }

        /* ---------- Anzeigetafel ---------- */
        .scoreboard {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 10px;
            background: #000;
            border: 3px solid #455a64;
            border-radius: 16px;
            padding: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .team-score {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 120px;
            padding: 8px;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .team-score.active-turn {
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 15px var(--gold);
            border-color: var(--gold);
            transform: scale(1.04);
        }

        .team-name { font-size: 1.15rem; font-weight: bold; margin-top: 4px; }
        .star-badge { font-size: 0.8rem; color: #b0bec5; }
        .goals { font-size: 2.3rem; font-weight: 900; color: var(--gold); line-height: 1.1; }

        .round-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #90a4ae;
            min-width: 90px;
        }

        .team-avatars { display: flex; gap: 4px; justify-content: center; }

        /* ---------- Spielfeld ---------- */
        .turn-banner {
            font-size: 1.4rem;
            font-weight: bold;
            padding: 6px 18px 6px 8px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .turn-banner .avatar { border-color: #fff; }

        .math-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 15px 25px 25px 25px;
            margin-bottom: 10px;
            position: relative;
        }

        .mini-pitch {
            position: relative;
            height: 60px;
            max-width: 460px;
            margin: 0 auto 5px auto;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.3);
        }

        #shot-ball {
            position: absolute;
            left: 4%;
            top: 14px;
            font-size: 2rem;
            transition: left 0.6s ease-out, transform 0.6s ease-out;
        }

        .goal-icon {
            position: absolute;
            right: 0;
            top: 0;
            font-size: 2.8rem;
        }

        #keeper {
            position: absolute;
            right: 3.4rem;
            top: 14px;
            font-size: 1.7rem;
            animation: keeper 1.6s ease-in-out infinite;
            transition: transform 0.3s;
        }

        @keyframes keeper {
            0%, 100% { transform: translateY(-8px); }
            50% { transform: translateY(8px); }
        }

        .mini-pitch.hit #shot-ball { left: calc(100% - 2.6rem); transform: rotate(720deg) scale(0.85); }
        .mini-pitch.hit .goal-icon { animation: net 0.5s 0.5s; }
        .mini-pitch.hit #keeper { animation: none; transform: translateY(-22px) rotate(-30deg); }

        .mini-pitch.saved #shot-ball { left: 62%; transform: rotate(360deg); }
        .mini-pitch.saved #keeper { animation: none; transform: scale(1.6); }

        .mini-pitch.no-anim #shot-ball { transition: none; }

        @keyframes net {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .question {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 10px 0;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }

        .answers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 450px;
            margin: 0 auto;
        }

        .ans-btn {
            background: #eceff1;
            color: #102027;
            font-size: 2rem;
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 5px 0 #90a4ae;
        }

        .ans-btn:hover { background: #ffffff; transform: translateY(-2px); }
        .ans-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #90a4ae; }
        .ans-btn.correct { background: #00e676 !important; color: #000; box-shadow: 0 5px 0 #00a152; }
        .ans-btn.wrong { background: #ff1744 !important; color: #fff; box-shadow: 0 5px 0 #b2102f; }

        .feedback-overlay {
            font-size: 1.5rem;
            font-weight: bold;
            min-height: 40px;
            margin-top: 15px;
        }

        /* ---------- Timer ---------- */
        .timer {
            position: relative;
            height: 26px;
            max-width: 460px;
            margin: 0 auto 10px auto;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 13px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.25);
        }

        .timer-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 100%;
            background: linear-gradient(90deg, #00c853, #64dd17);
        }

        .timer.warn .timer-fill { background: linear-gradient(90deg, #ff1744, #ff9100); }
        .timer.warn { animation: pulse 0.5s ease-in-out infinite; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .timer-num {
            position: relative;
            font-weight: 900;
            font-size: 1rem;
            line-height: 22px;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }

        /* ---------- Textaufgaben ---------- */
        .story-box { margin: 5px 0 20px 0; }

        .story-text {
            font-size: 1.35rem;
            line-height: 1.5;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.25);
            border-left: 5px solid var(--gold);
            border-radius: 12px;
            padding: 12px 16px;
            text-align: left;
        }

        .read-btn {
            background: #455a64;
            color: #fff;
            font-size: 1rem;
            padding: 6px 14px;
            margin-top: 10px;
        }

        .story-visual {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
        }

        .story-group {
            display: grid;
            gap: 2px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px dashed rgba(255, 215, 0, 0.6);
            border-radius: 10px;
            padding: 5px 6px;
            font-size: 1.15rem;
            line-height: 1.2;
        }

        .story-solution {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--gold);
            margin-top: 12px;
            min-height: 1.8rem;
        }

        /* ---------- Endbildschirm ---------- */
        .trophy { font-size: 5rem; margin: 10px 0; }
        .winner-text { font-size: 2rem; color: var(--gold); font-weight: bold; margin-bottom: 15px; }

        .result-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 520px;
            margin: 0 auto 15px auto;
        }

        .result-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 10px 14px;
            text-align: left;
            border-left: 5px solid var(--pc);
        }

        .result-row .r-main { flex: 1; }
        .result-row .r-name { font-size: 1.25rem; font-weight: bold; }
        .result-row .r-msg { font-size: 1rem; color: #cfd8dc; margin-top: 2px; }
        .result-row .r-score { font-size: 1.8rem; font-weight: 900; color: var(--gold); white-space: nowrap; }

        .unlock-msg {
            color: var(--gold);
            font-weight: bold;
        }

        .end-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
        }

        .hidden { display: none !important; }

        @media (max-width: 480px) {
            .stadium-card { padding: 16px; }
            h1 { font-size: 1.6rem; }
            .question { font-size: 2.6rem; letter-spacing: 1px; }
            .player-card { min-width: 100%; }
            .turn-banner { font-size: 1.15rem; }
        }
    </style>
</head>
<body>

<!-- Hintergrund: Flutlicht, rollende Bälle, Fans mit La-Ola-Welle -->
<div id="bg" aria-hidden="true">
    <div class="light l1"></div>
    <div class="light l2"></div>
    <span class="roll r1">⚽</span>
    <span class="roll r2">⚽</span>
    <span class="roll r3">⚽</span>
    <div class="crowd" id="crowd"></div>
</div>
<div id="confetti" aria-hidden="true"></div>

<div class="stadium-card">
    <!-- STARTBILDSCHIRM -->
    <div id="setup-screen">
        <h1>⚽ 1x1 Champions Arena ⚽</h1>
        <div class="subtitle">2. Klasse Volksschule – Ilian, Johan & Helena</div>

        <div class="setup-section">
            <strong>1. Wer spielt mit?</strong>
            <div class="player-setup" id="player-setup"></div>
        </div>

        <div class="setup-section">
            <strong>2. Schwierigkeitsstufe:</strong>
            <div class="choice-group" id="level-group"></div>
            <div class="rule-hint">⭐ Geschafft = mindestens 7 von 10 richtig. 2 Sterne → nächste Stufe wird frei!</div>
        </div>

        <div class="setup-section">
            <strong>3. Spielmodus:</strong>
            <div class="choice-group" id="mode-group"></div>
        </div>

        <div class="setup-section">
            <strong>4. Aufgabenart:</strong>
            <div class="choice-group" id="task-group"></div>
        </div>

        <div class="setup-section">
            <strong>5. Zeit:</strong>
            <div class="choice-group" id="timer-group"></div>
        </div>

        <button class="start-btn" onclick="startGame()">ANPFIFF! 🏟️</button>
        <div class="setup-error" id="setup-error"></div>

        <details class="parents">
            <summary>⚙️ Eltern-Bereich</summary>
            <button type="button" onclick="unlockAll()">🔓 Alle Stufen freischalten</button>
            <button type="button" onclick="resetProgress()">🗑️ Fortschritt zurücksetzen</button>
        </details>
    </div>

    <!-- SPIELBILDSCHIRM -->
    <div id="game-screen" class="hidden">
        <div class="scoreboard" id="scoreboard"></div>

        <div id="turn-indicator" class="turn-banner"></div>

        <div class="math-box">
            <div class="mini-pitch" id="mini-pitch">
                <span id="shot-ball">⚽</span>
                <span id="keeper">🧤</span>
                <span class="goal-icon">🥅</span>
            </div>
            <div class="timer hidden" id="timer">
                <div class="timer-fill" id="timer-fill"></div>
                <span class="timer-num" id="timer-num"></span>
            </div>
            <div class="question" id="question-text"></div>
            <div class="story-box hidden" id="story-box">
                <div class="story-text" id="story-text"></div>
                <button class="read-btn" id="read-btn" onclick="readStory()">🔊 Vorlesen</button>
                <div class="story-visual" id="story-visual"></div>
                <div class="story-solution" id="story-solution"></div>
            </div>
            <div class="answers-grid" id="answers-container"></div>
            <div class="feedback-overlay" id="feedback-text"></div>
        </div>
    </div>

    <!-- ENDBILDSCHIRM -->
    <div id="end-screen" class="hidden">
        <div class="trophy" id="trophy">🏆</div>
        <div class="winner-text" id="winner-headline"></div>
        <div class="result-list" id="result-list"></div>
        <p id="final-stats" style="font-size: 1.15rem; margin: 0 0 20px 0;"></p>
        <div class="end-buttons">
            <button class="start-btn" onclick="startGame()">NOCHMAL! 🔄</button>
            <button class="secondary-btn" onclick="resetToMenu()">🏠 Menü</button>
        </div>
    </div>
</div>

<script>
    // ================= Einstellungen =================
    const PLAYERS = [
        { id: 'ilian', name: 'Ilian', color: '#0288d1', dot: '🔵',
          stars: ['Lionel Messi 🐐', 'Kylian Mbappé ⚡', 'Erling Haaland 🤖', 'Lamine Yamal 🌟', 'David Alaba 🇦🇹'] },
        { id: 'johan', name: 'Johan', color: '#d32f2f', dot: '🔴',
          stars: ['Cristiano Ronaldo 🚀', 'Jude Bellingham 👑', 'Vinícius Júnior 🔥', 'Jamal Musiala ✨', 'Marko Arnautović 🇦🇹'] },
        { id: 'helena', name: 'Helena', color: '#8e24aa', dot: '🟣',
          stars: ['Aitana Bonmatí ✨', 'Alexia Putellas 👑', 'Sarah Puntigam 🇦🇹', 'Giulia Gwinn ⚡', 'Lionel Messi 🐐'] }
    ];

    const LEVELS = {
        1: { name: 'Rookie', icon: '🥉', desc: '1er, 2er, 5er, 10er' },
        2: { name: 'Profi', icon: '🥈', desc: '+ 3er & 4er Reihe' },
        3: { name: 'Weltmeister', icon: '🥇', desc: 'Alle 1x1 Reihen' }
    };

    const WINS_TO_UNLOCK = 2;        // So oft muss eine Stufe geschafft werden
    const SHOTS_PER_PLAYER = 10;     // Aufgaben pro Kind (Duell & Solo)
    const PASS_CORRECT = 7;          // Mindestens so viele richtig = geschafft
    const COOP_GOALS_PER_PLAYER = 5; // Team-Pokal: Tor-Ziel pro Kind
    const TIME_CALC = 10;            // Sekunden für klassische 1x1-Aufgaben
    const TIME_STORY = 15;           // Sekunden für Textaufgaben

    const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ================= Speicher (nur auf diesem Gerät) =================
    function load(key, fallback) {
        try {
            const v = localStorage.getItem(key);
            return v ? JSON.parse(v) : fallback;
        } catch (e) { return fallback; }
    }
    function save(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; }
    }

    let progress = load('arena-progress', {});   // { ilian: { 1: 2, 2: 0 } }
    let settings = Object.assign(
        { selected: ['ilian', 'johan'], captains: {}, level: 1, mode: 'versus', task: 'calc', timer: false },
        load('arena-settings', {})
    );
    const photos = {};
    PLAYERS.forEach(p => { const ph = load('arena-photo-' + p.id, null); if (ph) photos[p.id] = ph; });

    const saveSettings = () => save('arena-settings', settings);
    const P = id => PLAYERS.find(p => p.id === id);
    const selectedPlayers = () => PLAYERS.filter(p => settings.selected.includes(p.id));
    const wins = (pid, lvl) => (progress[pid] && progress[pid][lvl]) || 0;
    const isUnlocked = (pid, lvl) => lvl === 1 || wins(pid, lvl - 1) >= WINS_TO_UNLOCK;
    const levelOpen = lvl => selectedPlayers().every(p => isUnlocked(p.id, lvl));
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];
    // "Ilian", "Ilian & Johan", "Ilian, Johan & Helena"
    const joinNames = arr => arr.length < 2 ? arr.join('') : arr.slice(0, -1).join(', ') + ' & ' + arr[arr.length - 1];

    // Name des Kapitäns ohne Emoji, z.B. "Lionel Messi"
    function captainName(pid) {
        return (settings.captains[pid] || P(pid).stars[0]).replace(/\s+\S+$/, '');
    }

    function avatarHTML(pid, size) {
        const p = P(pid);
        if (photos[pid]) {
            return `<img class="avatar ${size}" style="--pc:${p.color}" src="${photos[pid]}" alt="${p.name}">`;
        }
        return `<span class="avatar ${size}" style="--pc:${p.color}">${p.name[0]}</span>`;
    }

    function progressHTML(pid) {
        return [1, 2, 3].map(l => {
            const w = wins(pid, l);
            if (!isUnlocked(pid, l)) return `<span>${LEVELS[l].icon} 🔒</span>`;
            const shown = Math.min(w, WINS_TO_UNLOCK);
            const extra = w > WINS_TO_UNLOCK ? ` +${w - WINS_TO_UNLOCK}` : '';
            return `<span>${LEVELS[l].icon} ${'⭐'.repeat(shown)}${'☆'.repeat(WINS_TO_UNLOCK - shown)}${extra}</span>`;
        }).join('');
    }

    // ================= Fotos =================
    function handlePhoto(pid, file) {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            // Quadratisch zuschneiden und verkleinern, damit es in den Speicher passt
            const s = Math.min(img.width, img.height);
            const c = document.createElement('canvas');
            c.width = c.height = 200;
            c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 200, 200);
            URL.revokeObjectURL(url);
            photos[pid] = c.toDataURL('image/jpeg', 0.85);
            if (!save('arena-photo-' + pid, photos[pid])) {
                showSetupError('Das Foto konnte nicht dauerhaft gespeichert werden – es gilt nur bis zum Neuladen.');
            }
            renderSetup();
        };
        img.onerror = () => { URL.revokeObjectURL(url); showSetupError('Dieses Bild konnte nicht geladen werden.'); };
        img.src = url;
    }

    function removePhoto(pid) {
        delete photos[pid];
        try { localStorage.removeItem('arena-photo-' + pid); } catch (e) {}
        renderSetup();
    }

    // ================= Startbildschirm =================
    function showSetupError(msg) {
        document.getElementById('setup-error').innerText = msg;
    }

    function togglePlayer(pid) {
        if (settings.selected.includes(pid)) {
            settings.selected = settings.selected.filter(id => id !== pid);
        } else {
            settings.selected.push(pid);
        }
        showSetupError('');
        saveSettings();
        renderSetup();
    }

    function lockHint(lvl) {
        const prev = LEVELS[lvl - 1].name;
        return '🔒 ' + selectedPlayers()
            .filter(p => !isUnlocked(p.id, lvl))
            .map(p => {
                if (!isUnlocked(p.id, lvl - 1)) return `${p.name}: erst ${prev} freispielen`;
                return `${p.name}: noch ${WINS_TO_UNLOCK - wins(p.id, lvl - 1)}× ${prev}`;
            })
            .join(', ');
    }

    function renderChoices(containerId, items, current, onPick) {
        const box = document.getElementById(containerId);
        box.innerHTML = '';
        items.forEach(it => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'choice-btn' + (it.val === current ? ' active' : '') + (it.locked ? ' locked' : '');
            b.dataset.val = it.val;
            b.innerHTML = `${it.label}<br><small>${it.sub}</small>`;
            b.onclick = () => {
                if (it.locked) {
                    b.classList.remove('shake');
                    void b.offsetWidth;
                    b.classList.add('shake');
                    return;
                }
                onPick(it.val);
            };
            box.appendChild(b);
        });
    }

    function renderSetup() {
        // Spieler-Karten
        const wrap = document.getElementById('player-setup');
        wrap.innerHTML = '';
        PLAYERS.forEach(p => {
            const on = settings.selected.includes(p.id);
            const cap = settings.captains[p.id] || p.stars[0];
            const card = document.createElement('div');
            card.className = 'player-card' + (on ? ' selected' : '');
            card.dataset.pid = p.id;
            card.style.setProperty('--pc', p.color);
            card.innerHTML = `
                <button class="join-btn" type="button">${on ? '✅ Spielt mit' : '➕ Mitspielen'}</button>
                <div>${avatarHTML(p.id, 'avatar-lg')}</div>
                <div class="photo-actions">
                    <label class="photo-btn">📷 Foto<input type="file" accept="image/*" hidden></label>
                    ${photos[p.id] ? '<button class="photo-del" type="button" title="Foto entfernen">🗑️</button>' : ''}
                </div>
                <h3>${p.dot} ${p.name}</h3>
                <label class="cap-label">Kapitän:</label>
                <select>${p.stars.map(s => `<option${s === cap ? ' selected' : ''}>${s}</option>`).join('')}</select>
                <div class="progress-line">${progressHTML(p.id)}</div>`;
            card.querySelector('.join-btn').onclick = () => togglePlayer(p.id);
            card.querySelector('input[type=file]').onchange = e => {
                if (e.target.files && e.target.files[0]) handlePhoto(p.id, e.target.files[0]);
            };
            const del = card.querySelector('.photo-del');
            if (del) del.onclick = () => removePhoto(p.id);
            card.querySelector('select').onchange = e => { settings.captains[p.id] = e.target.value; saveSettings(); };
            wrap.appendChild(card);
        });

        // Stufe: auf die höchste freie Stufe zurückfallen, falls gesperrt
        while (settings.level > 1 && !levelOpen(settings.level)) settings.level--;
        renderChoices('level-group', [1, 2, 3].map(l => ({
            val: l,
            label: `${LEVELS[l].icon} ${LEVELS[l].name}`,
            sub: levelOpen(l) ? LEVELS[l].desc : lockHint(l),
            locked: !levelOpen(l)
        })), settings.level, v => { settings.level = v; saveSettings(); renderSetup(); });

        // Modus abhängig von der Anzahl der Kinder
        const n = selectedPlayers().length;
        let modes;
        if (n <= 1) {
            settings.mode = 'solo';
            modes = [{ val: 'solo', label: '🎯 Solo-Training', sub: `${SHOTS_PER_PLAYER} Schüsse – schaffst du ${PASS_CORRECT}?` }];
        } else {
            if (settings.mode === 'solo') settings.mode = 'versus';
            modes = [
                { val: 'versus', label: '⚔️ Elfmeter-Duell', sub: `${n === 2 ? '1 gegen 1' : 'Jeder gegen jeden'} – je ${SHOTS_PER_PLAYER} Schüsse` },
                { val: 'coop', label: '🤝 Team-Pokal', sub: `Gemeinsam ${n * COOP_GOALS_PER_PLAYER} Tore schießen` }
            ];
        }
        renderChoices('mode-group', modes, settings.mode, v => { settings.mode = v; saveSettings(); renderSetup(); });

        renderChoices('task-group', [
            { val: 'calc', label: '🔢 Rechnen', sub: 'z.B. 4 × 5 = ?' },
            { val: 'story', label: '📖 Textaufgaben', sub: 'Fußball-Geschichten mit Bild' },
            { val: 'mixed', label: '🎲 Gemischt', sub: 'Beides abwechselnd' }
        ], settings.task, v => { settings.task = v; saveSettings(); renderSetup(); });

        renderChoices('timer-group', [
            { val: false, label: '😌 Ohne Timer', sub: 'In Ruhe nachdenken' },
            { val: true, label: '⏱️ Mit Timer', sub: `Rechnen ${TIME_CALC} s · Textaufgaben ${TIME_STORY} s` }
        ], settings.timer, v => { settings.timer = v; saveSettings(); renderSetup(); });
    }

    function unlockAll() {
        PLAYERS.forEach(p => {
            progress[p.id] = progress[p.id] || {};
            [1, 2].forEach(l => { progress[p.id][l] = Math.max(wins(p.id, l), WINS_TO_UNLOCK); });
        });
        save('arena-progress', progress);
        renderSetup();
    }

    function resetProgress() {
        if (!confirm('Wirklich alle Sterne von allen Kindern löschen?')) return;
        progress = {};
        save('arena-progress', progress);
        settings.level = 1;
        saveSettings();
        renderSetup();
    }

    // ================= Textaufgaben =================
    const pl = (n, one, many) => n === 1 ? one : many;

    // a = Anzahl der Gruppen, b = Anzahl pro Gruppe, n = Name des Kindes, star = Kapitän
    const STORIES = [
        { icon: '⭐', text: (a, b, n) => `${n} kauft ${a} ${pl(a, 'Packung', 'Packungen')} Fußball-Sticker. In jeder Packung ${pl(b, 'ist 1 Sticker', `sind ${b} Sticker`)}. Wie viele Sticker sind das zusammen?` },
        { icon: '⚽', text: (a, b) => `Der Zeugwart füllt ${a} ${pl(a, 'Ballnetz', 'Ballnetze')}. In jedes Netz kommen ${b} ${pl(b, 'Ball', 'Bälle')}. Wie viele Bälle sind das?` },
        { icon: '🧑', text: (a, b) => `Im Fanbus gibt es ${a} ${pl(a, 'Reihe', 'Reihen')}. In jeder Reihe ${pl(b, 'sitzt 1 Fan', `sitzen ${b} Fans`)}. Wie viele Fans fahren mit zum Spiel?` },
        { icon: '🟠', text: (a, b) => `Beim Training stellt der Trainer ${a} ${pl(a, 'Reihe', 'Reihen')} mit je ${b} Hütchen auf. Wie viele Hütchen sind das?` },
        { icon: '🧣', text: (a, b) => `Im Fanshop liegen ${a} Stapel mit je ${b} ${pl(b, 'Schal', 'Schals')}. Wie viele Schals sind es insgesamt?` },
        { icon: '✍️', text: (a, b, n, star) => `${star} schreibt für ${a} ${pl(a, 'Kind', 'Kinder')} je ${b} ${pl(b, 'Autogramm', 'Autogramme')}. Wie viele Autogramme sind das?` },
        { icon: '🎯', text: (a, b, n) => `Bei der Torwand bringt jeder Treffer ${b} ${pl(b, 'Punkt', 'Punkte')}. ${n} trifft ${a === 1 ? 'einmal' : a + '‑mal'}. Wie viele Punkte bekommt ${n}?` },
        { icon: '🥤', text: (a, b) => `In einer Getränkekiste stehen ${a} ${pl(a, 'Reihe', 'Reihen')} mit je ${b} ${pl(b, 'Flasche', 'Flaschen')}. Wie viele Flaschen sind in der Kiste?` },
        { icon: '💶', text: (a, b, n) => `Ein Fußball-Poster kostet ${b} Euro. ${n} kauft ${a} Poster. Wie viel Euro muss ${n} bezahlen?` },
        { icon: '👟', text: (a, b) => `In der Kabine stehen ${a} ${pl(a, 'Regal', 'Regale')}. In jedem Regal ${pl(b, 'steht 1 Fußballschuh', `stehen ${b} Fußballschuhe`)}. Wie viele Schuhe sind das?` },
        { icon: '🥅', text: (a, b) => `Im Turnier spielen ${a} ${pl(a, 'Mannschaft', 'Mannschaften')}. Jede Mannschaft schießt ${b} ${pl(b, 'Tor', 'Tore')}. Wie viele Tore fallen insgesamt?` },
        { icon: '🍕', text: (a, b) => `Nach dem Sieg gibt es Pizza! Auf ${a} ${pl(a, 'Teller', 'Tellern')} liegen je ${b} ${pl(b, 'Stück', 'Stücke')}. Wie viele Stücke sind das?` }
    ];

    function renderStory(a, b) {
        const story = pick(STORIES);
        const pid = currentPid();
        document.getElementById('story-text').innerText = story.text(a, b, P(pid).name, captainName(pid));
        document.getElementById('story-solution').innerText = '';

        // Bild: a Gruppen mit je b Symbolen
        const visual = document.getElementById('story-visual');
        visual.innerHTML = '';
        for (let g = 0; g < a; g++) {
            const group = document.createElement('div');
            group.className = 'story-group';
            // Bis 5 in einer Zeile, darüber in zwei Zeilen (z.B. 6 = 3 + 3, 8 = 4 + 4)
            const cols = b <= 5 ? b : Math.ceil(b / 2);
            group.style.gridTemplateColumns = `repeat(${cols}, auto)`;
            for (let i = 0; i < b; i++) {
                const item = document.createElement('span');
                item.innerText = story.icon;
                group.appendChild(item);
            }
            visual.appendChild(group);
        }
    }

    function readStory() {
        if (!('speechSynthesis' in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(document.getElementById('story-text').innerText);
        u.lang = 'de-DE';
        u.rate = 0.9;
        speechSynthesis.speak(u);
    }

    if (!('speechSynthesis' in window)) {
        document.getElementById('read-btn').classList.add('hidden');
    }

    // ================= Animationen =================
    (function buildCrowd() {
        const fans = ['🙋', '🧒', '👦', '👧', '🧑', '👨', '👩', '🙌', '🧔', '👱'];
        const crowd = document.getElementById('crowd');
        const count = Math.max(10, Math.min(30, Math.round(window.innerWidth / 45)));
        for (let i = 0; i < count; i++) {
            const f = document.createElement('span');
            f.className = 'fan';
            f.innerText = fans[i % fans.length];
            f.style.animationDelay = (i * 0.1) + 's'; // La-Ola-Welle
            crowd.appendChild(f);
        }
    })();

    function confetti(count) {
        if (reduceMotion) return;
        const box = document.getElementById('confetti');
        const bits = ['🎉', '⭐', '✨', '⚽', '🎊', '🏆'];
        for (let i = 0; i < count; i++) {
            const s = document.createElement('span');
            s.className = 'conf';
            s.innerText = pick(bits);
            s.style.left = (Math.random() * 100) + 'vw';
            s.style.animationDuration = (1.4 + Math.random() * 1.4) + 's';
            s.style.animationDelay = (Math.random() * 0.4) + 's';
            box.appendChild(s);
            setTimeout(() => s.remove(), 3500);
        }
    }

    function cheer(ms) {
        document.body.classList.add('cheer');
        clearTimeout(cheer.t);
        cheer.t = setTimeout(() => document.body.classList.remove('cheer'), ms);
    }

    function resetPitch() {
        const pitch = document.getElementById('mini-pitch');
        pitch.classList.add('no-anim');
        pitch.classList.remove('hit', 'saved');
        void pitch.offsetWidth;
        pitch.classList.remove('no-anim');
    }

    // ================= Timer =================
    let timerInterval = null;

    function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    function startTimer(seconds) {
        stopTimer();
        const box = document.getElementById('timer');
        const fill = document.getElementById('timer-fill');
        const num = document.getElementById('timer-num');
        const end = Date.now() + seconds * 1000;
        box.classList.remove('hidden', 'warn');

        const tick = () => {
            const left = Math.max(0, end - Date.now());
            fill.style.width = (left / (seconds * 1000) * 100) + '%';
            num.innerText = `⏱️ ${Math.ceil(left / 1000)} s`;
            box.classList.toggle('warn', left <= 3000);
            if (left <= 0) {
                stopTimer();
                checkAnswer(null, null); // Zeit abgelaufen = kein Tor
            }
        };
        tick();
        timerInterval = setInterval(tick, 100);
    }

    // ================= Spiel =================
    let game = null;
    let currentAnswer = 0;
    let currentEquation = '';
    let isStory = false;
    let isLocked = false;

    const currentPid = () => game.players[game.turn % game.players.length];
    const totalAsked = () => game.players.reduce((s, id) => s + game.stats[id].asked, 0);
    const coopTarget = () => game.players.length * COOP_GOALS_PER_PLAYER;

    function startGame() {
        const sel = selectedPlayers();
        if (!sel.length) {
            showSetupError('Bitte zuerst auswählen, wer mitspielt! 👆');
            return;
        }
        if (!levelOpen(settings.level)) settings.level = 1;

        game = {
            players: sel.map(p => p.id),
            level: settings.level,
            mode: sel.length === 1 ? 'solo' : settings.mode,
            task: settings.task,
            timer: !!settings.timer,
            turn: 0,
            teamGoals: 0,
            stats: {}
        };
        sel.forEach(p => { game.stats[p.id] = { correct: 0, asked: 0 }; });

        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');

        updateUI();
        generateQuestion();
    }

    function getAllowedTables() {
        // Typischer Stoff der 2. Klasse Volksschule Österreich
        if (game.level === 1) return [1, 2, 5, 10];
        if (game.level === 2) return [1, 2, 3, 4, 5, 10];
        return [2, 3, 4, 5, 6, 7, 8, 9, 10];
    }

    function generateQuestion() {
        isLocked = false;
        document.getElementById('feedback-text').innerText = '';
        resetPitch();

        isStory = game.task === 'story' || (game.task === 'mixed' && Math.random() < 0.5);

        // Bei Textaufgaben ohne "× 1" – die Geschichten sollen echte Gruppen zeigen
        const tables = getAllowedTables().filter(t => !isStory || t !== 1);
        const table = pick(tables);
        const multiplier = isStory
            ? Math.floor(Math.random() * 9) + 2
            : Math.floor(Math.random() * 10) + 1;

        // Zufällig tauschen (z.B. 3x5 oder 5x3)
        const swap = Math.random() > 0.5;
        const a = swap ? table : multiplier;
        const b = swap ? multiplier : table;

        currentAnswer = a * b;
        currentEquation = `${a} × ${b} = ${currentAnswer}`;

        if ('speechSynthesis' in window) speechSynthesis.cancel();
        const questionEl = document.getElementById('question-text');
        const storyBox = document.getElementById('story-box');
        if (isStory) {
            questionEl.classList.add('hidden');
            storyBox.classList.remove('hidden');
            renderStory(a, b);
        } else {
            storyBox.classList.add('hidden');
            questionEl.classList.remove('hidden');
            questionEl.innerText = `${a} × ${b} = ?`;
        }

        // 3 plausible Falschantworten erzeugen
        const options = new Set([currentAnswer]);
        while (options.size < 4) {
            let offset = (Math.floor(Math.random() * 5) - 2) * (Math.random() > 0.5 ? table : 1);
            if (offset === 0) offset = Math.floor(Math.random() * 4) + 1;
            const wrong = currentAnswer + offset;
            if (wrong > 0 && wrong !== currentAnswer) options.add(wrong);
        }

        const shuffled = Array.from(options).sort(() => Math.random() - 0.5);
        const container = document.getElementById('answers-container');
        container.innerHTML = '';
        shuffled.forEach(num => {
            const btn = document.createElement('button');
            btn.className = 'ans-btn';
            btn.innerText = num;
            btn.onclick = () => checkAnswer(num, btn);
            container.appendChild(btn);
        });

        if (game.timer) {
            startTimer(isStory ? TIME_STORY : TIME_CALC);
        } else {
            document.getElementById('timer').classList.add('hidden');
        }
    }

    function checkAnswer(selected, btnElement) {
        if (isLocked) return;
        isLocked = true;
        stopTimer();
        const timedOut = selected === null;

        const pid = currentPid();
        const name = P(pid).name;
        const feedback = document.getElementById('feedback-text');
        const pitch = document.getElementById('mini-pitch');
        const correct = selected === currentAnswer;

        game.stats[pid].asked++;

        if (correct) {
            game.stats[pid].correct++;
            if (game.mode === 'coop') game.teamGoals++;
            btnElement.classList.add('correct');
            pitch.classList.add('hit');
            cheer(1500);
            confetti(18);
            feedback.innerText = pick([
                `TOOOOR! Traumschuss von ${name}! ⚽🔥`,
                `WELTKLASSE! Genau wie ${captainName(pid)}! 🌟`,
                `UNHALTBAR ins Kreuzeck, ${name}! 🚀`,
                `SUPER GEMACHT! Ein echtes Traumtor! 🎉`
            ]);
            feedback.style.color = '#00e676';
        } else {
            if (btnElement) btnElement.classList.add('wrong');
            pitch.classList.add('saved');
            document.querySelectorAll('.ans-btn').forEach(b => {
                if (parseInt(b.innerText) === currentAnswer) b.classList.add('correct');
            });
            feedback.innerText = timedOut
                ? `⏰ Zeit abgelaufen! Richtig wäre ${currentAnswer} gewesen.`
                : `Gehalten! Richtig wäre ${currentAnswer} gewesen. 🧤`;
            feedback.style.color = '#ff8a80';
        }

        if (isStory) {
            document.getElementById('story-solution').innerText = `📝 ${currentEquation}`;
        }

        updateUI();

        // Bei Textaufgaben etwas länger warten, damit man Bild & Rechnung anschauen kann
        const delay = isStory ? (correct ? 2500 : 3500) : 1800;
        setTimeout(() => {
            if (checkGameOver()) {
                showEndScreen();
            } else {
                game.turn++;
                updateUI();
                generateQuestion();
            }
        }, delay);
    }

    function checkGameOver() {
        if (game.mode === 'coop') return game.teamGoals >= coopTarget();
        return totalAsked() >= game.players.length * SHOTS_PER_PLAYER;
    }

    function updateUI() {
        const pid = currentPid();
        const board = document.getElementById('scoreboard');

        if (game.mode === 'coop') {
            board.innerHTML = `
                <div class="team-score">
                    <div class="team-avatars">${game.players.map(id => avatarHTML(id, 'avatar-md')).join('')}</div>
                    <span class="team-name">Team ${joinNames(game.players.map(id => P(id).name))}</span>
                    <span class="star-badge">${totalAsked()} Versuche</span>
                </div>
                <div class="team-score">
                    <span class="team-name">Tore (Ziel: ${coopTarget()})</span>
                    <span class="goals">${game.teamGoals}</span>
                </div>`;
        } else {
            const n = game.players.length;
            const round = Math.min(SHOTS_PER_PLAYER, Math.floor(game.turn / n) + 1);
            const cards = game.players.map(id => `
                <div class="team-score${id === pid ? ' active-turn' : ''}">
                    ${avatarHTML(id, 'avatar-md')}
                    <span class="team-name">${P(id).dot} ${P(id).name}</span>
                    <span class="star-badge">${captainName(id)}</span>
                    <span class="goals">${game.stats[id].correct}</span>
                </div>`);
            const roundBox = `<div class="round-box"><div>Runde</div><div>${round} / ${SHOTS_PER_PLAYER}</div><div style="font-size:1.4rem">⚽</div></div>`;
            if (n === 2) {
                board.innerHTML = cards[0] + roundBox + cards[1];
            } else {
                board.innerHTML = cards.join('') + roundBox;
            }
        }

        const banner = document.getElementById('turn-indicator');
        banner.innerHTML = `${avatarHTML(pid, 'avatar-sm')} ${P(pid).name} ist am Ball!`;
        banner.style.background = P(pid).color;
    }

    // Stern vergeben und neue Stufen melden
    function awardStar(pid) {
        const lvl = game.level;
        const before = lvl < 3 && isUnlocked(pid, lvl + 1);
        progress[pid] = progress[pid] || {};
        progress[pid][lvl] = wins(pid, lvl) + 1;
        const after = lvl < 3 && isUnlocked(pid, lvl + 1);
        const w = wins(pid, lvl);

        let msg = `⭐ ${LEVELS[lvl].name} geschafft! (${w}×)`;
        if (lvl < 3 && !before && after) {
            msg += ` <span class="unlock-msg">🔓 ${LEVELS[lvl + 1].icon} ${LEVELS[lvl + 1].name} ist jetzt frei!</span>`;
            return { msg, unlocked: true };
        }
        if (lvl < 3 && !after) {
            msg += ` Noch ${WINS_TO_UNLOCK - w}× bis ${LEVELS[lvl + 1].name}.`;
        }
        return { msg, unlocked: false };
    }

    function showEndScreen() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');

        const headline = document.getElementById('winner-headline');
        const stats = document.getElementById('final-stats');
        const list = document.getElementById('result-list');
        const trophy = document.getElementById('trophy');
        const names = game.players.map(id => P(id).name);
        const rows = [];
        let anyUnlock = false;
        stats.innerText = '';

        if (game.mode === 'coop') {
            const attempts = totalAsked();
            const maxAttempts = Math.ceil(coopTarget() * SHOTS_PER_PLAYER / PASS_CORRECT);
            const passed = attempts <= maxAttempts;
            headline.innerText = '🏆 TEAM-WELTMEISTER! 🏆';
            trophy.innerText = '🏆';
            stats.innerText = `${joinNames(names)} haben gemeinsam ${coopTarget()} Tore in ${attempts} Versuchen geschossen!`;
            game.players.forEach(id => {
                let msg;
                if (passed) {
                    const r = awardStar(id);
                    anyUnlock = anyUnlock || r.unlocked;
                    msg = r.msg;
                } else {
                    msg = `Für einen ⭐ braucht das Team höchstens ${maxAttempts} Versuche – nochmal!`;
                }
                rows.push({ id, score: `${game.stats[id].correct} ⚽`, msg });
            });
        } else {
            game.players.forEach(id => {
                const c = game.stats[id].correct;
                let msg;
                if (c >= PASS_CORRECT) {
                    const r = awardStar(id);
                    anyUnlock = anyUnlock || r.unlocked;
                    msg = r.msg;
                } else {
                    msg = `Für einen ⭐ braucht man ${PASS_CORRECT} von ${SHOTS_PER_PLAYER}. Fast!`;
                }
                rows.push({ id, score: `${c} / ${SHOTS_PER_PLAYER}`, msg, c });
            });

            if (game.mode === 'solo') {
                const ok = rows[0].c >= PASS_CORRECT;
                trophy.innerText = ok ? '🏆' : '💪';
                headline.innerText = ok ? `⭐ STARK, ${names[0].toUpperCase()}! ⭐` : `💪 WEITER SO, ${names[0].toUpperCase()}!`;
            } else {
                rows.sort((x, y) => y.c - x.c);
                const best = rows[0].c;
                const winners = rows.filter(r => r.c === best).map(r => P(r.id).name.toUpperCase());
                trophy.innerText = '🏆';
                if (winners.length === 1) {
                    headline.innerText = `🏆 ${winners[0]} GEWINNT DEN POKAL! 🏆`;
                } else if (winners.length === game.players.length) {
                    headline.innerText = '🤝 UNENTSCHIEDEN! ALLE SIND CHAMPIONS! 🤝';
                } else {
                    headline.innerText = `🤝 ${joinNames(winners)} TEILEN SICH DEN POKAL!`;
                }
            }
        }

        save('arena-progress', progress);

        list.innerHTML = rows.map(r => `
            <div class="result-row" style="--pc:${P(r.id).color}">
                ${avatarHTML(r.id, 'avatar-md')}
                <div class="r-main">
                    <div class="r-name">${P(r.id).dot} ${P(r.id).name}</div>
                    <div class="r-msg">${r.msg}</div>
                </div>
                <div class="r-score">${r.score}</div>
            </div>`).join('');

        cheer(anyUnlock ? 4000 : 2500);
        confetti(anyUnlock ? 60 : 35);
    }

    function resetToMenu() {
        stopTimer();
        if ('speechSynthesis' in window) speechSynthesis.cancel();
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
        renderSetup();
    }

    renderSetup();
</script>
